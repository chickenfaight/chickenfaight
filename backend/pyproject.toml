[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "better-profanity>=0.7.0",
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.13.0",
    "itsdangerous>=2.2.0",
    "openai>=3.24.0",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.54",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.alembic]
script_location = "%(here)s/app/db/migrations"
prepend_sys_path = ["."]
# Date-prefixed files sort in creation order; see "Changing the schema" in BACKEND.md.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
