name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  backend-unit-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: chickenfaight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d chickenfaight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_URL: postgresql://ci:ci@localhost:5432/chickenfaight_unused
      TEST_POSTGRES_URL: postgresql://ci:ci@localhost:5432/chickenfaight_test
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      SESSION_SECRET: ci-only-session-secret
      INFERENCE_BASE_URL: https://example.invalid/v1
      INFERENCE_API_KEY: ci-placeholder
      APP_ENV: test

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6.0.1
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run backend tests
        run: uv run --no-sync pytest -v -rs
