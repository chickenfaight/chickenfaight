name: App release

on:
  push:
    tags:
      - "app/v*"

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the shared app GitHub Release
      packages: write

    steps:
      - name: Download tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set image name and version
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/check-app-version.py --tag "$RELEASE_TAG"
          echo "name=ghcr.io/chickenfaight/backend" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#app/v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Publish shared app release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.image.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > "$RUNNER_TEMP/app-release-notes.md" <<EOF
          Frontend and backend release $VERSION from commit $GITHUB_SHA.

          Backend image: ghcr.io/chickenfaight/backend:$VERSION
          Immutable image: ghcr.io/chickenfaight/backend@$IMAGE_DIGEST
          Build the frontend from this tag with the deployment's NEXT_PUBLIC_BACKEND_URL.

          See DEPLOYMENT.md at this tag for rollout and recovery procedures.
          EOF
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest=false --title "App $VERSION" \
            --notes-file "$RUNNER_TEMP/app-release-notes.md"
